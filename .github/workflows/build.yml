name: Build and Test Action

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Action
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bdscan/package.json
      
      - name: Setup Azure DevOps npm authentication
        working-directory: ./bdscan
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          if [ -z "$AZURE_PAT" ]; then
            echo "::error::AZURE_DEVOPS_PAT secret is not set!"
            echo "Please add the secret in GitHub repository settings"
            exit 1
          fi
          echo "registry=https://pkgs.dev.azure.com/allegionit/_packaging/allepackage/npm/registry/" > .npmrc
          echo "always-auth=true" >> .npmrc
          echo "//pkgs.dev.azure.com/allegionit/_packaging/allepackage/npm/registry/:_password=$AZURE_PAT" >> .npmrc
          echo "//pkgs.dev.azure.com/allegionit/_packaging/allepackage/npm/registry/:username=allegionit" >> .npmrc
          echo "//pkgs.dev.azure.com/allegionit/_packaging/allepackage/npm/registry/:email=npm@allegion.com" >> .npmrc
          echo "✓ Azure DevOps npm authentication configured"
          echo "Registry configuration:"
          grep "registry=" .npmrc
      
      - name: Install dependencies
        working-directory: ./bdscan
        run: npm ci --no-audit --verbose 2>&1 | grep -E "allepackage|registry.npmjs.org|added.*packages" || npm ci --no-audit
      
      - name: Run tests
        working-directory: ./bdscan
        run: npm test
      
      - name: Build action
        working-directory: ./bdscan
        run: npm run build
      
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Uncommitted changes detected. Please run 'npm run build' and commit the dist folder."
            git status
            exit 1
          fi
