name: Build and Test Action

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Action
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bdscan/package.json
      
      - name: Install dependencies
        working-directory: ./bdscan
        run: npm ci
      
      - name: Run tests
        working-directory: ./bdscan
        run: npm test
      
      - name: Build action
        working-directory: ./bdscan
        run: npm run build
      
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Uncommitted changes detected. Please run 'npm run build' and commit the dist folder."
            git status
            exit 1
          fi
