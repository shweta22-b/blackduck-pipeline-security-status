name: Black Duck Security Check

on:
  push:
    branches: [ main, develop, feature/github-bd-vulnerability-task-migration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  blackduck-scan:
    name: Black Duck Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Azure DevOps npm authentication
        working-directory: ./bdscan
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          if [ -z "$AZURE_PAT" ]; then
            echo "::error::AZURE_DEVOPS_PAT secret is not set!"
            exit 1
          fi
          echo "registry=https://pkgs.dev.azure.com/allegionit/_packaging/allepackage/npm/registry/" > .npmrc
          echo "always-auth=true" >> .npmrc
          echo "//pkgs.dev.azure.com/allegionit/_packaging/allepackage/npm/registry/:_password=$AZURE_PAT" >> .npmrc
          echo "//pkgs.dev.azure.com/allegionit/_packaging/allepackage/npm/registry/:username=allegionit" >> .npmrc
          echo "//pkgs.dev.azure.com/allegionit/_packaging/allepackage/npm/registry/:email=npm@allegion.com" >> .npmrc

      - name: Install dependencies
        working-directory: ./bdscan
        run: npm ci --no-audit

      - name: Validate Black Duck Token
        env:
          BLACKDUCK_TOKEN: ${{ secrets.BLACKDUCK_API_TOKEN }}
        run: |
          if [ -z "$BLACKDUCK_TOKEN" ]; then
            echo "::warning::BLACKDUCK_API_TOKEN secret is not set. Skipping Black Duck scan."
            echo "To enable scanning, add BLACKDUCK_API_TOKEN secret in repository settings."
            echo "skip_scan=true" >> $GITHUB_ENV
          else
            echo "skip_scan=false" >> $GITHUB_ENV
          fi
        
      - name: Execute Black Duck Scan
        if: env.skip_scan == 'false'
        uses: ./
        with:
          blackduck-url: ${{ vars.BLACKDUCK_URL || 'allegion.blackducksoftware.com' }}
          blackduck-token: ${{ secrets.BLACKDUCK_API_TOKEN }}
          project-name: ${{ github.event.repository.name }}
          version-name: ${{ github.ref_name }}
          fail-on-security-risks: 'true'
          fail-on-license-risks: 'true'
          fail-on-policy-violations: 'true'
