name: Build and Test

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test Action
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install dependencies
        working-directory: ./bdscan
        run: npm ci --no-audit
      
      - name: Build TypeScript
        working-directory: ./bdscan
        run: npm run build
      
      - name: Verify dist folder
        run: |
          if [ ! -d "./bdscan/dist" ]; then
            echo "::error::dist folder not created!"
            exit 1
          fi
          if [ ! -f "./bdscan/dist/index.js" ]; then
            echo "::error::dist/index.js not found!"
            exit 1
          fi
          echo "✅ Build successful - dist folder created"
      
      - name: Run tests (if available)
        working-directory: ./bdscan
        run: npm test --if-present
        continue-on-error: true
      
      - name: Check for uncommitted dist changes
        run: |
          if [ -n "$(git status --porcelain bdscan/dist)" ]; then
            echo "::warning::Uncommitted changes in dist/ folder detected"
            echo "::warning::Run 'npm run build' and commit the changes"
            git status bdscan/dist
          else
            echo "✅ dist/ folder is up to date"
          fi
