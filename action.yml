# ========================================
# Black Duck Security Scan GitHub Action
# ========================================
# Scans Black Duck projects for security vulnerabilities,
# license risks, and policy violations during CI/CD pipelines
# ========================================

name: 'Black Duck Security Scan'
description: 'Scan Black Duck projects for security vulnerabilities, license risks, and policy violations'
author: 'ProductTech'
branding:
  icon: 'shield'
  color: 'blue'

# ========================================
# Input Parameters
# ========================================
inputs:
  blackduck-url:
    description: 'Black Duck server URL (e.g., allegion.blackducksoftware.com)'
    required: false
    default: 'allegion.blackducksoftware.com'
  blackduck-token:
    description: 'API token for Black Duck authentication'
    required: true
  project-name:
    description: 'Name of the Black Duck project'
    required: true
  version-name:
    description: 'Name of the Black Duck version'
    required: true
  fail-on-security-risks:
    description: 'Fail action on CRITICAL or HIGH security risks'
    required: false
    default: 'false'
  security-exclusions:
    description: 'Comma-separated list of security component names to exclude from checks'
    required: false
    default: ''
  fail-on-license-risks:
    description: 'Fail action on CRITICAL or HIGH license risks'
    required: false
    default: 'false'
  license-exclusions:
    description: 'Comma-separated list of licenses to exclude from checks'
    required: false
    default: ''
  fail-on-policy-violations:
    description: 'Fail action on policy violations'
    required: false
    default: 'false'
  policy-severities:
    description: 'Policy violation severities to check (BLOCKER,CRITICAL,MAJOR,MINOR,TRIVIAL). Leave empty to check all severities.'
    required: false
    default: ''
  policy-exclusions:
    description: 'Comma-separated list of policy names to exclude from checks'
    required: false
    default: ''

# ========================================
# Action Runtime Configuration
# ========================================
runs:
  using: 'node20'
  main: 'bdscan/dist/index.js'
